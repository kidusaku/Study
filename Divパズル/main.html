<!-- CSSのスマホ表示の順番を意識。→躓いた点。変に多くのclassを作らない。
 header→left→right→center-upper→center-lower→right-center-lower→fotter
-->
<body>
    <div class="all">

        <div class="header">#FFCE7a</div>

        <div class="left">#9DDDF4</div>

        <div class="center-upper">#C2FFC8</div>
        <div class="center-lower">#FFC2C5</div>

    </div>
